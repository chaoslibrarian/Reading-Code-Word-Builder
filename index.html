<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Code Word Builder</title>
<style>
  :root {
    --bg: #fef6e4;
    --card: #ffffff;
    --ink: #3d3d3d;
    --accent: #2a9d8f;
    --accent2: #8bd3dd;
    --good: #6bcB77;
    --bad: #f25c54;
    --slot-empty: #eee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Comic Sans MS', 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .app {
    width: 100%;
    max-width: 520px;
    padding: 24px 16px 40px;
    text-align: center;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .sub {
    font-size: 0.95rem;
    opacity: 0.7;
    margin-bottom: 18px;
  }
  .scorebar {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 1rem;
    margin-bottom: 18px;
  }
  .scorebar span b { color: var(--accent2); }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.06);
  }

  .emoji {
    font-size: 5rem;
    line-height: 1;
    margin-bottom: 6px;
    transition: transform 0.15s ease;
  }
  .emoji.bump { transform: scale(1.15) rotate(-4deg); }

  .hear-btn {
    border: none;
    background: var(--accent2);
    color: white;
    font-size: 0.95rem;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 22px;
  }
  .hear-btn:active { transform: scale(0.96); }

  .slots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 26px;
  }
  .slot {
    width: 60px;
    height: 70px;
    border-radius: 14px;
    background: var(--slot-empty);
    border: 3px dashed #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .slot.filled {
    background: var(--accent2);
    border: 3px solid var(--accent2);
    color: white;
  }
  .slots.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .slots.correct .slot {
    background: var(--good);
    border-color: var(--good);
  }

  .bank {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    min-height: 74px;
  }
  .tile {
    width: 58px;
    height: 64px;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    font-size: 1.8rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    transition: opacity 0.15s, transform 0.1s;
  }
  .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .tile.used { opacity: 0; pointer-events: none; }

  .footer {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .btn {
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.95rem;
    cursor: pointer;
    background: #eee;
    color: var(--ink);
  }
  .btn.primary {
    background: var(--accent);
    color: white;
    display: none;
  }
  .btn.primary.show { display: inline-block; }

  .difficulty {
    margin-top: 16px;
    font-size: 0.85rem;
    opacity: 0.75;
  }
  .difficulty select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .message {
    min-height: 26px;
    font-size: 1.05rem;
    font-weight: bold;
    margin-top: 10px;
  }
  .message.good { color: var(--good); }
  .message.bad { color: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <h1>Reading Code Word Builder</h1>
  <div class="sub">Tap the letters to spell the word</div>

  <div class="scorebar">
    <span>Score: <b id="score">0</b></span>
    <span>Streak: <b id="streak">0</b></span>
  </div>

  <div class="card">
    <div class="emoji" id="emoji">🐱</div>
    <button class="hear-btn" id="hearBtn">🔊 Hear the word</button>

    <div class="slots" id="slots"></div>
    <div class="bank" id="bank"></div>

    <div class="message" id="message">&nbsp;</div>

    <div class="footer">
      <button class="btn" id="resetBtn">Clear</button>
      <button class="btn primary" id="nextBtn">Next word →</button>
    </div>
  </div>

  <div class="difficulty">
    Word family:
    <select id="family"></select>
    &nbsp;&nbsp;Difficulty:
    <select id="difficulty">
      <option value="easy">Easy (letters only)</option>
      <option value="hard">Hard (extra letter)</option>
    </select>
    <br>
    <label style="display:inline-flex; align-items:center; gap:6px; margin-top:10px; cursor:pointer;">
      <input type="checkbox" id="blendOnly">
      Blends only (bl, cr, st, spr&hellip;)
    </label>
    &nbsp;&nbsp;
    <label style="display:inline-flex; align-items:center; gap:6px; margin-top:10px; cursor:pointer;">
      <input type="checkbox" id="noBlend">
      No blends
    </label>
    <br>
    <label style="display:inline-flex; align-items:center; gap:6px; margin-top:10px; cursor:pointer;">
      <input type="checkbox" id="digraphOnly">
      Digraphs only (ch, sh, th, wh)
    </label>
    &nbsp;&nbsp;
    <label style="display:inline-flex; align-items:center; gap:6px; margin-top:10px; cursor:pointer;">
      <input type="checkbox" id="noDigraph">
      No digraphs
    </label>
  </div>
</div>

const FAMILIES = [...new Set(WORDS.map((w) => w.family))];

const BLENDS = [
  "scr", "shr", "spl", "spr", "squ", "str", "thr",
  "bl", "br", "cl", "cr", "dr", "dw", "fl", "fr", "gl", "gr",
  "pl", "pr", "sc", "sk", "sl", "sm", "sn", "sp", "st", "sw", "tr", "tw"
];

function startsWithBlend(word) {
  return BLENDS.some((b) => word.startsWith(b));
}

const DIGRAPHS = ["ch", "sh", "th", "wh", "ph"];

function startsWithDigraph(word) {
  return DIGRAPHS.some((d) => word.startsWith(d));
}

const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");

let current = null;
let slotLetters = [];   // letter placed in each slot, or null
let bankState = [];     // { letter, used }
let score = 0;
let streak = 0;

const emojiEl = document.getElementById("emoji");
const slotsEl = document.getElementById("slots");
const bankEl = document.getElementById("bank");
const messageEl = document.getElementById("message");
const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");
const hearBtn = document.getElementById("hearBtn");
const difficultySel = document.getElementById("difficulty");
const familySel = document.getElementById("family");
const blendOnlyEl = document.getElementById("blendOnly");
const noBlendEl = document.getElementById("noBlend");
const digraphOnlyEl = document.getElementById("digraphOnly");
const noDigraphEl = document.getElementById("noDigraph");

familySel.innerHTML =
  '<option value="__any__">All families</option>' +
  FAMILIES.map((f) => `<option value="${f}">-${f} words</option>`).join("");

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.8;
  utter.pitch = 1.1;
  window.speechSynthesis.speak(utter);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function applyFilter(pool, test) {
  const filtered = pool.filter(test);
  return filtered.length ? filtered : pool;
}

function currentPool() {
  const family = familySel.value;
  const familyPool = family === "__any__" ? WORDS : WORDS.filter((w) => w.family === family);
  let pool = familyPool.length ? familyPool : WORDS;

  if (blendOnlyEl.checked) {
    pool = applyFilter(pool, (w) => startsWithBlend(w.word));
  } else if (noBlendEl.checked) {
    pool = applyFilter(pool, (w) => !startsWithBlend(w.word));
  }

  if (digraphOnlyEl.checked) {
    pool = applyFilter(pool, (w) => startsWithDigraph(w.word));
  } else if (noDigraphEl.checked) {
    pool = applyFilter(pool, (w) => !startsWithDigraph(w.word));
  }

  return pool;
}

function pickWord() {
  const pool = currentPool();
  let choice;
  do {
    choice = pool[Math.floor(Math.random() * pool.length)];
  } while (current && choice.word === current.word && pool.length > 1);
  return choice;
}

function newRound() {
  current = pickWord();
  const letters = current.word.split("");
  slotLetters = new Array(letters.length).fill(null);

  let pool = letters.slice();
  if (difficultySel.value === "hard") {
    let extra;
    do {
      extra = LETTERS[Math.floor(Math.random() * LETTERS.length)];
    } while (letters.includes(extra));
    pool.push(extra);
  }
  pool = shuffle(pool);
  bankState = pool.map((letter, i) => ({ id: i, letter, used: false }));

  emojiEl.textContent = current.emoji;
  messageEl.textContent = " ";
  messageEl.className = "message";
  slotsEl.classList.remove("shake", "correct");
  nextBtn.classList.remove("show");

  renderSlots();
  renderBank();
}

function renderSlots() {
  slotsEl.innerHTML = "";
  slotLetters.forEach((letter, i) => {
    const div = document.createElement("div");
    div.className = "slot" + (letter ? " filled" : "");
    div.textContent = letter ? letter.toUpperCase() : "";
    div.addEventListener("click", () => clearSlot(i));
    slotsEl.appendChild(div);
  });
}

function renderBank() {
  bankEl.innerHTML = "";
  bankState.forEach((item) => {
    const div = document.createElement("div");
    div.className = "tile" + (item.used ? " used" : "");
    div.textContent = item.letter.toUpperCase();
    div.addEventListener("click", () => placeLetter(item));
    bankEl.appendChild(div);
  });
}

function placeLetter(item) {
  if (item.used) return;
  const emptyIndex = slotLetters.findIndex((l) => l === null);
  if (emptyIndex === -1) return;
  item.used = true;
  slotLetters[emptyIndex] = item.letter;
  renderSlots();
  renderBank();

  if (slotLetters.every((l) => l !== null)) {
    checkAnswer();
  }
}

function clearSlot(i) {
  if (!slotLetters[i]) return;
  const letter = slotLetters[i];
  const match = bankState.find((b) => b.letter === letter && b.used);
  if (match) match.used = false;
  slotLetters[i] = null;
  renderSlots();
  renderBank();
}

function clearAll() {
  slotLetters = slotLetters.map(() => null);
  bankState.forEach((b) => (b.used = false));
  renderSlots();
  renderBank();
  messageEl.textContent = " ";
  messageEl.className = "message";
  slotsEl.classList.remove("shake", "correct");
}

function checkAnswer() {
  const guess = slotLetters.join("");
  if (guess === current.word) {
    score += 10;
    streak += 1;
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    messageEl.textContent = "Yes! That's " + current.word.toUpperCase() + "!";
    messageEl.className = "message good";
    slotsEl.classList.add("correct");
    emojiEl.classList.add("bump");
    setTimeout(() => emojiEl.classList.remove("bump"), 300);
    speak(current.word);
    nextBtn.classList.add("show");
  } else {
    streak = 0;
    streakEl.textContent = streak;
    messageEl.textContent = "Not quite, try again!";
    messageEl.className = "message bad";
    slotsEl.classList.add("shake");
    setTimeout(() => {
      slotsEl.classList.remove("shake");
      clearAll();
    }, 500);
  }
}

hearBtn.addEventListener("click", () => current && speak(current.word));
resetBtn.addEventListener("click", clearAll);
nextBtn.addEventListener("click", newRound);
difficultySel.addEventListener("change", newRound);
familySel.addEventListener("change", newRound);
blendOnlyEl.addEventListener("change", () => {
  if (blendOnlyEl.checked) noBlendEl.checked = false;
  newRound();
});
noBlendEl.addEventListener("change", () => {
  if (noBlendEl.checked) blendOnlyEl.checked = false;
  newRound();
});
digraphOnlyEl.addEventListener("change", () => {
  if (digraphOnlyEl.checked) noDigraphEl.checked = false;
  newRound();
});
noDigraphEl.addEventListener("change", () => {
  if (noDigraphEl.checked) digraphOnlyEl.checked = false;
  newRound();
});

newRound();
</script>
</body>
